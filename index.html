<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화이트펜슬 스터디카페</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1b4332;
  --green-mid:#2d6a4f;
  --border:#e2e0d8;
  --ink3:#9a9a8e;
  --header-h:60px;
  --tab-h:54px;
}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;}

/* ── HEADER ── */
.site-header{
  height:var(--header-h);
  background:var(--green);
  color:#fff;
  padding:0 16px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  z-index:100;
}
.site-header img{height:30px;width:30px;object-fit:contain;border-radius:6px;}
.header-title{font-size:15px;font-weight:700;letter-spacing:-.02em;}
.header-sub{font-size:10px;color:#95d5b2;font-family:'DM Mono',monospace;letter-spacing:.06em;margin-top:1px;}

/* ── TAB BAR ── */
.tab-bar{
  height:var(--tab-h);
  display:flex;
  background:#fff;
  border-bottom:2px solid var(--border);
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  flex-shrink:0;
  z-index:99;
}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:1;
  min-width:60px;
  padding:0 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  cursor:pointer;
  border:none;
  background:none;
  color:var(--ink3);
  font-family:'Noto Sans KR',sans-serif;
  font-size:9.5px;
  font-weight:500;
  border-bottom:3px solid transparent;
  transition:color .18s,border-color .18s,background .18s;
  white-space:nowrap;
  position:relative;
  bottom:-2px;
}
.tab-btn .ti{font-size:17px;line-height:1;}
.tab-btn.active{color:var(--green-mid);border-bottom-color:var(--green-mid);background:#f7fbf8;}

/* ── IFRAME PANELS ── */
.panel-wrap{
  flex:1;
  position:relative;
  overflow:hidden;
}
.iframe-panel{
  position:absolute;
  inset:0;
  display:none;
}
.iframe-panel.active{display:block;}
.iframe-panel iframe{
  width:100%;
  height:100%;
  border:none;
  display:block;
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <img src="https://play-lh.googleusercontent.com/aVTlh7-EuRIYzIPrVA1rkLxaMubV22zsVTKxcijMxmoAhuSZuxwP9Aq2pCbuw9EesLRk=w240-h480-rw" alt="화이트펜슬 로고">
  <div>
    <div class="header-title">화이트펜슬 스터디카페</div>
    <div class="header-sub">WHITEPENCIL STUDY CAFÉ</div>
  </div>
</header>

<!-- TAB BAR -->
<nav class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('calc')"   id="tab-calc">
    <span class="ti">💰</span>멤버십할인&등급확인
  </button>
  <button class="tab-btn" onclick="switchTab('library')" id="tab-library">
    <span class="ti">📚</span>도서관휴관일할인
  </button>
  <button class="tab-btn" onclick="switchTab('voice')"  id="tab-voice">
    <span class="ti">✉️</span>소통함
  </button>
  <button class="tab-btn" onclick="switchTab('faq')"    id="tab-faq">
    <span class="ti">❓</span>FAQ
  </button>
  <button class="tab-btn" onclick="switchTab('refund')" id="tab-refund">
    <span class="ti">🧾</span>환불계산기
  </button>
</nav>

<!-- PANELS -->
<div class="panel-wrap">

  <div class="iframe-panel active" id="panel-calc">
    <iframe src="https://yoosangbeom.github.io/whitepencil-membership/"
            title="멤버십 요금 계산기" loading="lazy"></iframe>
  </div>

  <div class="iframe-panel" id="panel-refund">
    <iframe src="https://yoosangbeom.github.io/refund-calculator/"
            title="환불 계산기" loading="lazy"></iframe>
  </div>

  <div class="iframe-panel" id="panel-library">
    <iframe src="https://yoosangbeom.github.io/Gasan_library_coupon/"
            title="가산도서관 휴관일 할인" loading="lazy"></iframe>
  </div>

  <div class="iframe-panel" id="panel-voice">
    <iframe src="https://yoosangbeom.github.io/whitepencil-voice/"
            title="화이트펜슬 소통함" loading="lazy"></iframe>
  </div>

  <div class="iframe-panel" id="panel-faq">
    <iframe src="https://whitepencil.notion.site/FAQ-613e4d255aa0493e80564952e15f11d2"
            title="화이트펜슬 FAQ" loading="lazy"></iframe>
  </div>

</div>

<script>
function switchTab(id) {
  document.querySelectorAll('.iframe-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
}
</script>
</body>
</html>
